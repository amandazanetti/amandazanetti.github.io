name: Cronitor Monitoring Relay

# Reports each run of the deploy workflow to Cronitor (start, success, failure).
# Requires the CRONITOR_API_KEY repository secret.
on:
  workflow_run:
    workflows: ["Deploy site"]
    types: [requested, completed]

permissions:
  actions: read
  contents: read

jobs:
  send-telemetry:
    runs-on: ubuntu-latest
    name: Send Telemetry
    steps:
      - name: Send execution details to Cronitor
        uses: cronitorio/monitor-github-actions@v8
        with:
          event: ${{ toJSON(github.event) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cronitor_key: ${{ secrets.CRONITOR_API_KEY }}
          cronitor_group: psi-amandazanetti
