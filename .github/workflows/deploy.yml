name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Install and Build
        env:
          CRONITOR_RUM_CLIENT_KEY: ${{ secrets.CRONITOR_RUM_CLIENT_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          # Keep the Cronitor RUM key out of the repository: inject it from a secret at build time.
          config=_config.yml
          if [ -n "$CRONITOR_RUM_CLIENT_KEY" ]; then
            printf 'cronitor_rum_client_key: "%s"\n' "$CRONITOR_RUM_CLIENT_KEY" > _config.secrets.yml
            config="$config,_config.secrets.yml"
          fi
          bundle exec jekyll build --config "$config"
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
