# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Amanda Zanetti · Psicanalista # used as the <title> of the home page
first_name: Amanda
middle_name:
last_name: Zanetti
contact_note: >
  Entre em contato pelo WhatsApp para agendar um horário.
description: >
  Psicanalista de orientação lacaniana (EPFCL), doutora em Psicologia Clínica e Cultura pela UnB. Análise online, em português, para adultos e adolescentes.
footer_text: >
  Psicanalista · Atendimentos online.
keywords: Amanda Zanetti, psicanalista, psicanálise, psicanálise lacaniana, Campo Lacaniano, EPFCL, análise online, psicanalista online, brasileiros no exterior
lang: pt-BR
icon: favicon.png
apple_touch_icon: # not used by al_folio_core; /apple-touch-icon.png at the site root is picked up by iOS

url: https://psi-amandazanetti.com
baseurl: # blank for root (username.github.io)
last_updated: false
impressum_path:
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark
protect_email: false

repo_trophies:
  enabled: false

# -----------------------------------------------------------------------------
# al-folio API (v1.x)
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: false
footer_fixed: false
search_enabled: false
socials_in_search: false
posts_in_search: false
bib_search: false

# Dimensions
max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image: https://psi-amandazanetti.com/assets/img/prof_pic.jpg

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

analytics:
  google:

# Cronitor RUM (visits and page performance). Leave blank here: the deploy workflow
# fills it from the CRONITOR_RUM_CLIENT_KEY repository secret. Loaded only in production builds.
cronitor_rum_client_key:

# -----------------------------------------------------------------------------
# Blog (disabled)
# -----------------------------------------------------------------------------

blog_name:
blog_description:
permalink: /blog/:year/:title/
lsi: false

pagination:
  enabled: false

related_blog_posts:
  enabled: false
  max_related: 0

giscus:
  repo:

# -----------------------------------------------------------------------------
# Collections (minimal)
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: false

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - bin/
  - docker-compose-slim.yml
  - lighthouse_results/
  - node_modules/
  - readme_preview/
  - requirements.txt
  - test/
  - Dockerfile
  - docker-compose.yml
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jemoji

  # al-folio plugins
  - al_folio_core
  - al_icons
  - al_folio_upgrade
  - al_cookie
  - al_img_tools
  - al_email_protect

# Sitemap settings
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ["robots.txt"]

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
  output_formats:
    webp: "-auto-orient -quality 85"

lazy_loading_images: true

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: false
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: false
enable_progressbar: false
enable_video_embedding: false

# -----------------------------------------------------------------------------
# Library versions
# -----------------------------------------------------------------------------

third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css"
    version: "7.2.0"
  academicons:
